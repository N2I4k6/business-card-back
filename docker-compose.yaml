services:
  postgres:
    image: postgres:16-alpine
    container_name: business-card
    restart: unless-stopped
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
      POSTGRES_DB: card
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: